name: Site check — generator, render, links

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by design. The scheduled collector owns publishing to main
# (kalshi-dashboard.yml); this workflow never commits, so a failing check can
# never stop the live site from refreshing, and a passing one proves the
# committed pages are exactly what the generator produces from the committed
# snapshot.
permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # jsdom@31 (the lockfile version) declares engines
          # "^22.22.2 || ^24.15.0 || >=26.0.0" — Node 20 installs it but dies on
          # import. 22 matches what dashboard.yml already uses.
          node-version: "22"

      - name: Install the one dev tool (jsdom, declared in package.json)
        run: npm ci --no-audit --no-fund

      - name: Unit tests (collector, fees, alerts, generator, site builder)
        run: python3 -m unittest discover -s tests -v

      - name: Collector pipeline on captured fixtures
        run: python3 -m collector.test_runner

      - name: Trading engine and fee table
        run: python3 -m trading.test_engine

      - name: Front-end syntax
        run: |
          node --check assets/desk.js
          node --check assets/nav.js
          node --check assets/live-probe.js

      # The browser-side swing detector is the only code path that can raise a
      # >= $0.10 alert between scheduled runs (N-02). Its logic is plain JS, so
      # it is tested under node rather than left to a manual click-through.
      - name: Browser swing detector logic
        run: node test/live-probe.test.mjs

      # Loads the shipped live.html in jsdom with the real probe script and a
      # stubbed demo API, and asserts a swing reaches the chat as a LIVE row.
      - name: Live probe reaches the chat (jsdom)
        run: node test/desk_live_probe_dc.mjs

      - name: Render every generated page offline (jsdom)
        run: node tools/root_pages_render.mjs

      - name: Internal links
        run: python3 tools/linkcheck.py

      # One canonical sidebar on every page (N-01): no duplicate destination,
      # identical order everywhere, active row keeps its slot.
      - name: Sidebar is canonical
        run: python3 tools/navcheck.py

      # Advisory: the snapshot in the repo is regenerated by the collector
      # workflow, so a diff here means the two drifted apart. Reported, never
      # blocking another session's branch.
      - name: Pages match the generator for the committed snapshot
        continue-on-error: true
        run: |
          python3 -m site_build.build
          if git diff --stat -- '*.html' 'assets/live.json' | grep -q .; then
            git diff --stat -- '*.html' 'assets/live.json'
            echo "::warning title=Generated pages drifted::committed HTML is not what site_build produces from the committed data/live.json — run python3 -m site_build.build and commit the result"
            exit 1
          fi
          echo "generated output matches what is committed"
