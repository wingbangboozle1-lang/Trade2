name: Kalshi dashboard — collect, build, publish

# Publishing model: Pages is the legacy branch build of `main` `/` (the only mode this
# repository's token can use). This workflow builds the dashboard into `kalshi-dashboard/`
# and commits it to `main`, so the site is served at /Trade2/kalshi-dashboard/ without
# touching root files owned by other sessions. The collector is locked to Kalshi demo only.

on:
  schedule:
    - cron: '*/30 * * * *'     # GitHub may delay scheduled runs (flag F-09)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'site/**'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: write

concurrency:
  group: kalshi-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (fee table, collector pipeline, request signing, circuit breaker)
        run: npm test

      - name: Restore collector state (price history, alerts, simulated trades)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kalshi-demo-state-${{ github.run_id }}
          restore-keys: |
            kalshi-demo-state-

      - name: Collect public Kalshi demo data (demo-only host guard)
        id: collect
        continue-on-error: true
        timeout-minutes: 14
        shell: bash
        env:
          KALSHI_BASE: ${{ vars.KALSHI_BASE }}
        run: |
          set -o pipefail
          node scripts/collect.mjs --state state --out kalshi-dashboard/data 2>&1 | tee collect.log

      - name: Save collector state
        if: steps.collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state
          key: kalshi-demo-state-${{ github.run_id }}

      - name: Record run result (always; published so the site and reviewers can see it)
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p kalshi-dashboard/data
          node -e '
            const fs = require("fs");
            let log = "";
            try { log = fs.readFileSync("collect.log", "utf8"); } catch (e) {}
            const lines = log.split("\n").filter((l) => /phase:|Error|error|stopped|deadline|circuit|unreachable/i.test(l));
            const outcome = process.env.COLLECT_OUTCOME || "unknown";
            const rec = {
              run_at: new Date().toISOString(),
              outcome,
              published: outcome === "success",
              last_phase: (lines.filter((l) => /phase:/.test(l)).pop() || "").trim(),
              reason: outcome === "success" ? "" : (lines.filter((l) => !/phase:/.test(l)).pop() || "collector exited with an error").trim().slice(0, 400),
              run_url: process.env.RUN_URL,
            };
            fs.writeFileSync("kalshi-dashboard/data/collector-run.json", JSON.stringify(rec, null, 1) + "\n");
            console.log(JSON.stringify(rec));
            if (outcome !== "success") console.log("::warning::Collector did not publish this run (" + rec.reason + "). The last committed snapshot stays online. See Flagged for review F-21.");
          '

      - name: Demo portfolio snapshot (read-only; skipped when secrets are not set)
        env:
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          # secrets cannot be used in a step-level `if:`, so the check happens here
          if [ -z "$KALSHI_DEMO_KEY_ID" ] || [ -z "$KALSHI_DEMO_PRIVATE_KEY" ]; then
            echo "Demo secrets not set: portfolio snapshot skipped (flag F-08)."
            exit 0
          fi
          node scripts/portfolio.mjs --out kalshi-dashboard/data

      - name: Build site and check every internal link
        run: node scripts/build-site.mjs --out kalshi-dashboard

      - name: Commit and publish to main (only on main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "kalshi-dashboard-bot"
          git config user.email "kalshi-dashboard-bot@users.noreply.github.com"
          git add kalshi-dashboard
          if git diff --cached --quiet; then
            echo "No change to publish."
            exit 0
          fi
          git commit -m "chore(dashboard): publish snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::push to main failed after 3 attempts"
          exit 1
