name: _probe-egress
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kalshi demo REST
        run: |
          set -x
          curl -sS -m 20 -o /tmp/status.json -w "HTTP:%{http_code}\n" \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status || true
          head -c 600 /tmp/status.json || true
          echo
          curl -sS -m 20 -o /tmp/mk.json -w "HTTP:%{http_code}\n" \
            "https://external-api.demo.kalshi.co/trade-api/v2/markets?status=open&limit=2" || true
          head -c 400 /tmp/mk.json || true
