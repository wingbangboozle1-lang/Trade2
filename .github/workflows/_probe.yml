name: _probe-egress
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kalshi demo REST
        run: |
          echo "== status =="
          curl -sS -m 25 -D /tmp/h.txt -o /tmp/b.json -w "HTTP:%{http_code}\n" \
            https://external-api.demo.kalshi.co/trade-api/v2/exchange/status || echo "CURLFAIL"
          head -c 400 /tmp/b.json 2>/dev/null; echo
          echo "== CORS =="
          grep -i "access-control" /tmp/h.txt || echo "no-cors-headers"
          echo "== markets =="
          curl -sS -m 25 -o /tmp/m.json -w "HTTP:%{http_code}\n" \
            "https://external-api.demo.kalshi.co/trade-api/v2/markets?status=open&limit=1" || echo CURLFAIL
