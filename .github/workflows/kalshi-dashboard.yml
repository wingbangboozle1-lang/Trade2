name: Kalshi dashboard — collect, build, deploy

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and can lag on a busy
    # queue; the dashboard's own refresh loop covers freshness in between.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      market_cap:
        description: "Markets to track per topic"
        default: "150"
  push:
    # main publishes the site; the working branches are included so the
    # pipeline can be exercised before merge.
    branches: ["main", "arena/f5837994-trade2", "arena/fb6cb424-trade2"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Syntax check the front-end
        run: |
          node --check assets/alerts-view.js
          node --check assets/desk.js
          node --test test/alerts-view.test.mjs

      - name: Collect
        env:
          MARKET_CAP: ${{ github.event.inputs.market_cap || '150' }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY_PATH: ${{ secrets.KALSHI_PRIVATE_KEY_PATH }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          if [ -n "$KALSHI_PRIVATE_KEY" ]; then
            printf '%s\n' "$KALSHI_PRIVATE_KEY" > /tmp/kalshi.pem
            export KALSHI_PRIVATE_KEY_PATH=/tmp/kalshi.pem
          fi
          python3 -m collector.collector --market-cap "$MARKET_CAP" --orderbook-cap 300

      - name: Rebuild static site data
        run: python3 -m site_build.build

      - name: Render check (root pages must render offline with no errors)
        run: |
          npm ci --no-audit --no-fund
          node test/root_render.mjs
          # `npm ci` must not change the lock file; if it does, drop the
          # drift so the rebase in the commit step is not blocked.
          git checkout -- package-lock.json package.json || true

      - name: Link check
        run: python3 tools/linkcheck.py

      # Added by session arena-dc732aa6 (R-D-01): the two scrolling chats, the
      # price-basis badges and the snapshot-age label are rendered by
      # assets/desk.js, which tools/rendercheck.mjs cannot execute (jsdom does
      # not fetch external scripts). This step runs the page + script together
      # against the published snapshot. It skips loudly if jsdom cannot be
      # installed, so an infra problem never fails a collection run silently.
      - name: Desk render check (browser path)
        run: |
          # jsdom is a declared dependency now; the install below is only a
          # fallback for a runner that skipped npm install, and the step becomes
          # a notice instead of a false failure if the registry is unreachable.
          if ! node -e 'require.resolve("jsdom")' >/dev/null 2>&1; then
            npm install --no-save --no-audit --no-fund jsdom >/dev/null 2>&1 || true
            git checkout -- package.json package-lock.json 2>/dev/null || true
          fi
          if node -e 'require.resolve("jsdom")' >/dev/null 2>&1; then
            node test/desk_render_dc732aa6.mjs
          else
            echo "::notice::jsdom unavailable — desk render check skipped"
          fi

      - name: Commit data
        run: |
          git config user.name  "kalshi-collector[bot]"
          git config user.email "kalshi-collector@users.noreply.github.com"
          git add -f data/ *.html categories/ assets/live.json
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "chore(data): collector run $(date -u +%FT%TZ) [skip ci]"
          # Another session or a concurrent run may have pushed; rebase and retry
          # instead of failing the whole collection.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && \
               git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push collected data after 3 attempts"
          exit 1
