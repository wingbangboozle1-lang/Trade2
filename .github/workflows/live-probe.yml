# Capability probe for the docs/ live layer (task T31, session arena-5bec0ea3).
#
# GitHub runners have unrestricted egress (this sandbox does not), so this is
# where browser-facing facts about the Kalshi demo API are actually verified:
#   - REST CORS for a GitHub Pages origin
#   - anonymous WebSocket handshake (browsers cannot send KALSHI-ACCESS-* headers)
#   - one live market GET (shape evidence)
# Results are committed to docs/data/capabilities.json and consumed by
# docs/assets/live.js to pick the honest live mode. Trigger manually
# (workflow_dispatch) so no push loops are created.

name: live capability probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run live probe (CORS + anonymous WS + reachability)
        run: |
          python3 tools/live_probe.py --root .
          {
            echo "## Live capability probe"
            echo '```'
            python3 -c "import json;d=json.load(open('docs/data/capabilities.json'));p=d['probes'];print('REST CORS browser_usable:',p['rest_cors']['browser_usable']);print('WS anonymous handshake accepted:',p['ws_anonymous_handshake']['anonymous_handshake_accepted']);print('WS status line:',p['ws_anonymous_handshake'].get('status_line'));print('REST market GET status:',p['rest_reachable'].get('status'))"
            echo '```'
            echo "Full raw evidence: docs/data/capabilities.json (also in the workflow artifact)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe evidence (survives a failed commit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capabilities-probe
          path: docs/data/capabilities.json

      - name: Commit capabilities
        run: |
          git config user.name "kalshi-live-probe[bot]"
          git config user.email "kalshi-live-probe[bot]@users.noreply.github.com"
          git config rebase.autoStash true
          git add docs/data/capabilities.json
          if git diff --cached --quiet; then
            echo "capabilities.json unchanged"
            exit 0
          fi
          # commit BEFORE pulling: `git pull --rebase` refuses staged changes
          git commit -m "chore(live): record API capability probe $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "::error::capability probe commit failed after 5 attempts"
          exit 1
