name: Live probe — verify request shapes against the demo API

# The browser swing detector (assets/live-probe.js) cannot be exercised against
# the real API from the sandbox that wrote it, because that sandbox has no route
# to Kalshi. This workflow closes the gap: it builds the URLs with the shipped
# module and asks the real demo API whether they mean what the code assumes.
#
# It exists because the first version of that module serialised `tickers` as a
# single comma-joined value AND, once corrected to repeated parameters, the
# check found that `GET /markets?tickers=…` answers 400 on the demo host. Both
# of those would have looked like "no swings" in the chat instead of an error.
#
# Read-only: it never commits, never writes a token, and never places an order.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "assets/live-probe.js"
      - "tools/probe_live_check.py"
      - "tools/probe_shape_assert.py"
      - ".github/workflows/probe-live.yml"

permissions:
  contents: read

concurrency:
  group: probe-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests for the probe module
        run: node test/live-probe.test.mjs

      - name: Verify the probe's URLs against the live demo API
        run: |
          set -o pipefail
          python3 tools/probe_live_check.py --json probe-live.json 2>&1 | tee probe-check.log
          python3 tools/probe_shape_assert.py probe-live.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-live-report
          path: |
            probe-live.json
            probe-check.log
          if-no-files-found: warn
          retention-days: 14
