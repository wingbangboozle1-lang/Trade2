name: Live probe — verify request shapes against the demo API

# The browser swing detector (assets/live-probe.js) cannot be exercised against
# the real API from the sandbox that wrote it, because that sandbox has no route
# to Kalshi. This workflow closes the gap: it builds the URLs with the shipped
# module and asks the real demo API whether they mean what the code assumes.
#
# What it proves, per the official specification:
#   * `tickers` is a repeated query parameter (form/explode). The probe sends
#     `?tickers=A&tickers=B`; a comma-joined value would be read as one unknown
#     ticker and return an empty book — indistinguishable from "no swings".
#   * `GET /markets?tickers=…` (tickers as the only filter) returns every
#     matching market in one unpaged response.
#   * `GET /markets/orderbooks?tickers=…` returns one entry per ticker, in
#     request order, each wrapped in `orderbook_fp`.
#
# Read-only: it never commits, never writes a token, and never places an order.

on:
  workflow_dispatch:
  schedule:
    # Hourly. Cheap (3 requests) and catches an API-shape change before a
    # weekend of nobody looking.
    - cron: "17 * * * *"
  push:
    paths:
      - "assets/live-probe.js"
      - "tools/probe_live_check.py"
      - ".github/workflows/probe-live.yml"

permissions:
  contents: read

concurrency:
  group: probe-live
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests for the probe module
        run: node test/live-probe.test.mjs

      - name: Verify the probe's URLs against the live demo API
        run: |
          set -o pipefail
          python3 tools/probe_live_check.py --json probe-live.json | tee probe-check.log
          # Re-assert the two documented invariants from the report itself, so a
          # silently-passing script cannot hide a shape change.
          # A heredoc body must start at column 0, so this lives in its own file
          # rather than inline: an indented body is a syntax error under bash.
          python3 tools/probe_shape_assert.py probe-live.json

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-live-report
          path: |
            probe-live.json
            probe-check.log
          if-no-files-found: warn
          retention-days: 14
