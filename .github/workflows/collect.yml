name: Collect Kalshi demo data

# Keeps the dashboard's data files fresh without any manual input.
# The collector only reads the public Kalshi demo REST API, so it needs no secrets.
on:
  schedule:
    # every 10 minutes (GitHub cron is UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note stored in the commit message'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: kalshi-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and publish snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: collector
        run: npm install --no-audit --no-fund

      - name: Unit tests (signing, alerts, liquidity, paper engine)
        working-directory: collector
        run: npm test

      - name: Collect Kalshi demo snapshot
        working-directory: collector
        env:
          KALSHI_API_BASE: https://external-api.demo.kalshi.co/trade-api/v2
        run: node src/collect.js

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No data changes to publish."
          else
            git commit -m "chore(data): refresh Kalshi demo snapshot (${{ github.event.inputs.note || 'scheduled run' }})"
            git push
            echo "Published refreshed snapshot."
          fi
