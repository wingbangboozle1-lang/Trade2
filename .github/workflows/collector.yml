name: collector

# Push runs: fast verification only (tests + site smoke) — they never touch the API
# and never commit, so a data commit can't trigger a loop and two runs never fight
# over Kalshi's unauthenticated rate limits.
#
# Schedule (every 15 min, default branch) and manual runs: collect live demo data,
# run the paper-trading engine, and commit refreshed docs/data JSON that the
# GitHub Pages site reads.
on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

# Never let two collectors run at once (they would fight over rate limits), but keep
# the scheduled collection in its own group so a merge-triggered push run cannot
# starve it. Per GitHub's own concurrency rules, a *pending* run in a group is
# cancelled when a newer run enters that same group, even with
# cancel-in-progress: false — that setting only protects the run that is already
# executing. Keying the group by event name therefore means: a queued
# schedule/dispatch run is only ever replaced by another queued
# schedule/dispatch run (a newer snapshot superseding an older one, which is
# what we want), while the fast verification push runs cancel each other freely.
# Source: https://github.com/github/docs/blob/main/data/reusables/actions/actions-group-concurrency.md
concurrency:
  group: collector-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests (fees vs official PDF table, engine rules, runner fixtures)
        run: |
          python3 -m trading.test_engine
          python3 -m collector.test_runner
          python3 -m py_compile collector/*.py trading/*.py

      - name: "Site smoke test (jsdom: every page renders with fixture data)"
        run: |
          npm install --no-audit --no-fund
          python3 test/gen_fixtures.py /tmp/fixture-data
          node test/site_smoke.mjs /tmp/fixture-data

      - name: Probe demo API connectivity (must be HTTP 200)
        if: github.event_name != 'push'
        run: |
          code=$(curl -sS -m 15 -o /tmp/probe.json -w '%{http_code}' \
            'https://external-api.demo.kalshi.co/trade-api/v2/exchange/status' || echo 000)
          echo "probe HTTP $code body: $(head -c 200 /tmp/probe.json 2>/dev/null)"
          cors=$(curl -sS -m 15 -I -H 'Origin: https://wingbangboozle1-lang.github.io' \
            'https://external-api.demo.kalshi.co/trade-api/v2/exchange/status' \
            | grep -i '^access-control-allow-origin' || true)
          echo "CORS: ${cors:-<none>}"
          test "$code" = "200"

      - name: Collect demo data (with headline lookup for >=$0.10 swings)
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          python3 -u -m collector.runner --news \
            --max-markets 8 --orderbook-top 10 --candle-top 10 2>&1 \
            | sed -u 's/^/[collector] /; s/^/::notice::/'

      - name: Run simulated trading engine
        if: github.event_name != 'push'
        run: python3 -m trading.engine

      - name: Commit refreshed data (schedule/dispatch only)
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: collector run $(date -u +%Y-%m-%dT%H:%MZ)"
            # Test steps can leave drift outside docs/data (npm install rewrites
            # package-lock.json); discard it now that docs/data is committed, or
            # git pull --rebase refuses with "you have unstaged changes".
            git checkout -- . || true
            git status --porcelain | head -20 || true
            # Several sessions' collectors push to main; retry the rebase+push on
            # race instead of failing the whole collection run. A rebase *conflict*
            # is handled separately, and honestly: everything this step commits is
            # regenerated from the live demo API by every run, so a conflict means a
            # concurrent collector published its own snapshot of the same files
            # first — equally current data, not a broken pipeline. Same treatment
            # `kalshi-dashboard.yml` already gives (request R-DC-4). A rejected
            # *push* after a clean rebase, or a conflict touching anything outside
            # docs/data, still fails loudly, so a real problem is never swallowed.
            for attempt in 1 2 3; do
              if git -c rebase.autoStash=true pull --rebase origin "${GITHUB_REF_NAME}" 2>/tmp/pull.err; then
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  echo "pushed on attempt $attempt"
                  break
                fi
                echo "::warning::push rejected on attempt $attempt (race with another collector); retrying"
              else
                cat /tmp/pull.err || true
                git rebase --abort 2>/dev/null || true
                outside=$(git diff --name-only "HEAD" "origin/${GITHUB_REF_NAME}" 2>/dev/null | grep -v '^docs/data/' | head -10 || true)
                if [ -z "$outside" ]; then
                  echo "::notice::snapshot superseded by a concurrent collector run (attempt $attempt); conflicting paths are all regenerated data:"
                  git diff --name-only "HEAD" "origin/${GITHUB_REF_NAME}" 2>/dev/null | head -20 || true
                  git reset --hard "origin/${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
                  exit 0
                fi
                echo "::error::rebase conflict touches files outside docs/data — not auto-resolving:"
                echo "$outside"
                exit 1
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::commit+push failed after 3 attempts"
                cat /tmp/pull.err || true
                git status --porcelain | head -30 || true
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Upload data snapshot artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-data
          path: docs/data/
          retention-days: 7
